<script>
const SITE = {

  // ── BASIC INFO ──
  name: "Aquarius Swim Academy",
  tagline: "Helping adult beginners swim in as little as one day.",
  about: "I've been teaching adults to swim in Dubai for years, specializing in nervous beginners who never thought they'd feel comfortable in deep water. My approach is simple: fewer fears, faster results, real confidence by the end of session one.",

  // ── PHOTO ──
  // Upload a photo to your GitHub repo (e.g. inside a "media" folder)
  // and put the filename here, like "media/pool-photo.jpg"
  // Or paste a full image link from elsewhere.
  photo_url: "",

  // ── VIDEO ──
  // Paste a YouTube link (unlisted is fine) or a direct video file link.
  video_url: "",

  // ── CONTACT LINKS ──
  // WhatsApp format: https://wa.me/971XXXXXXXXX (country code, no +, no spaces)
  whatsapp_link: "https://wa.me/971562607946",
  instagram_link: "https://instagram.com/swimcoach_ace",
  tiktok_link: "https://tiktok.com/@swimcoach_ace",
  facebook_link: "https://facebook.com/swimcoachace",

  // ── LOCATIONS ──
  // Add or remove as many as you like. map_link = Google Maps share link.
  locations: [
    { name: "Dive Campus Al Quoz 1st, Dubai", map_link: "https://maps.app.goo.gl/eaMwgyjxHtjx7VCK6" },
    { name: "Springdales School Al Quoz 4th, Dubai", map_link: "https://maps.app.goo.gl/LJcPCwAhnXjBonFU8" },
    { name: "Star International School Mirdif, Dubai", map_link: "https://maps.app.goo.gl/RYtQAoACeMdbesso8" },
  ],

  // ── IN-PERSON PACKAGES ──
  packages: [
    {
      name: "Survival Swim",
      price: "AED 349",
      featured: false,
      desc: "Float, tread & swim deep water — all in one day.",
      tags: ["3 sessions", "1 day", "45 min each"]
    },
    {
      name: "Basic Swim",
      price: "AED 899",
      featured: true,
      desc: "Survival skills + stroke technique over 3 days.",
      tags: ["9 sessions", "3 days", "45 min each"]
    },
    {
      name: "Private Swim",
      price: "AED 1,990 / 10 sessions",
      featured: false,
      desc: "1-on-1 coaching, your pace. +1 session free.",
      tags: ["10+1 sessions", "5 or 10 days", "From AED 230/session"]
    },
  ],

  // ── ONLINE COACHING ──
  online_price: "AED 150",
  online_desc: "Anywhere with a pool and a phone. I watch your technique on video call and correct it in real time.",

  // ── HOW IT WORKS ──
  steps: [
    "Message me on WhatsApp",
    "We pick a date & pool",
    "Swim deep water by end of day"
  ],

  // ── FAQ ──
  faq: [
    { q: "Do I need to know how to swim at all?", a: "No — most students start at zero. The Survival Swim class is built for complete beginners." },
    { q: "What age groups do you teach?", a: "Mainly adults, but the Basic and Private packages also work well for teens." },
    { q: "What should I bring?", a: "Just swimwear, a towel, and goggles if you have them. I'll let you know the pool location beforehand." }
  ],

};
</script>

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

  :root{
    --deep:     #0B3D5E;
    --mid:      #1A6A8A;
    --light:    #5FB3CC;
    --foam:     #E9F6FA;
    --ink:      #0D1B26;
    --muted:    #5C7A8A;
    --gold:     #E8A430;
    --surface:  #F7FBFC;
    --white:    #FFFFFF;
  }

  body{
    font-family:'Inter',sans-serif;
    background:var(--surface);
    color:var(--ink);
    display:flex;
    justify-content:center;
  }

  .page{
    width:100%;
    max-width:420px;
    min-height:100vh;
    background:var(--white);
    position:relative;
  }

  /* HEADER */
  .header{
    background:var(--deep);
    padding:48px 24px 64px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .ripple{ position:absolute; border-radius:50%; border:1.5px solid rgba(255,255,255,0.12); }
  .ripple1{ width:280px; height:280px; top:-140px; right:-90px; }
  .ripple2{ width:180px; height:180px; bottom:-100px; left:-60px; }

  .avatar{
    width:84px; height:84px; border-radius:50%;
    background:linear-gradient(145deg,var(--light),var(--mid));
    margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-size:34px; color:var(--white);
    border:3px solid rgba(255,255,255,0.25);
    position:relative; z-index:1;
    overflow:hidden;
    background-size:cover;
    background-position:center;
  }
  .name{ font-family:'Fraunces',serif; font-size:26px; color:var(--white); margin-bottom:6px; position:relative; z-index:1; }
  .role{ font-size:13px; color:var(--light); letter-spacing:0.04em; margin-bottom:14px; position:relative; z-index:1; }
  .bio-line{ font-size:13.5px; color:rgba(255,255,255,0.7); max-width:280px; margin:0 auto; line-height:1.55; position:relative; z-index:1; }

  .socials{ display:flex; justify-content:center; gap:10px; margin-top:20px; position:relative; z-index:1; }
  .social-pill{
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.18);
    color:var(--white); font-size:12px; font-weight:500;
    padding:7px 14px; border-radius:100px; text-decoration:none;
  }

  .body-wrap{ padding:28px 22px 40px; }

  .section-label{
    font-size:11px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--mid); margin-bottom:14px;
  }

  .cta-primary{
    display:block; text-align:center; background:var(--deep); color:var(--white);
    text-decoration:none; padding:16px; border-radius:14px; font-weight:600; font-size:15px;
    margin-bottom:8px;
  }
  .cta-primary .sub{ display:block; font-size:11.5px; font-weight:400; color:var(--light); margin-top:3px; }

  /* ABOUT */
  .about-section{ margin-top:30px; }
  .about-text{ font-size:13.5px; color:#3a5a6e; line-height:1.65; }

  /* MEDIA */
  .media-section{ margin-top:24px; }
  .media-photo{
    width:100%; border-radius:14px; display:block;
    border:1.5px solid var(--foam);
  }
  .media-video{
    width:100%; border-radius:14px; aspect-ratio:16/9; border:none;
  }
  .media-placeholder{
    border:1.5px dashed var(--foam); border-radius:14px; padding:24px;
    text-align:center; font-size:12.5px; color:var(--muted);
  }

  /* LOCATIONS */
  .locations-section{ margin-top:30px; }
  .location-row{
    display:flex; align-items:center; justify-content:space-between;
    border:1.5px solid var(--foam); border-radius:12px; padding:13px 16px;
    text-decoration:none; color:var(--ink); margin-bottom:8px;
  }
  .location-text{ font-size:13px; font-weight:500; display:flex; align-items:center; gap:8px; }
  .pin-dot{ width:7px; height:7px; border-radius:50%; background:var(--mid); flex-shrink:0; }
  .link-arrow{ color:var(--mid); font-size:16px; }

  /* PRICING */
  .pricing{ margin-top:30px; }
  .price-card{
    border:1.5px solid var(--foam); border-radius:14px; padding:18px 18px 20px;
    margin-bottom:12px; position:relative;
  }
  .price-card.featured{ border-color:var(--mid); background:linear-gradient(180deg,var(--foam),var(--white)); }
  .price-card-badge{
    position:absolute; top:-10px; right:16px; background:var(--gold); color:var(--ink);
    font-size:9.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    padding:4px 10px; border-radius:100px;
  }
  .price-card-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; gap:10px; }
  .price-card-name{ font-family:'Fraunces',serif; font-size:17px; color:var(--ink); }
  .price-card-amount{ font-family:'Fraunces',serif; font-size:18px; color:var(--deep); white-space:nowrap; text-align:right; }
  .price-card-desc{ font-size:12.5px; color:var(--muted); line-height:1.5; margin-bottom:10px; }
  .price-card-meta{ display:flex; gap:8px; flex-wrap:wrap; }
  .meta-chip{ font-size:10.5px; font-weight:600; color:var(--mid); background:var(--foam); padding:4px 9px; border-radius:100px; }
  .price-card.featured .meta-chip{ background:rgba(26,106,138,0.12); }

  /* ONLINE */
  .online-card{ background:var(--deep); border-radius:14px; padding:20px; margin-top:6px; color:var(--white); }
  .online-card-top{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .online-dot{ width:7px; height:7px; border-radius:50%; background:#4ADE80; box-shadow:0 0 0 3px rgba(74,222,128,0.2); }
  .online-label{ font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--light); }
  .online-title{ font-family:'Fraunces',serif; font-size:18px; margin-bottom:6px; }
  .online-desc{ font-size:12.5px; color:rgba(255,255,255,0.65); line-height:1.55; margin-bottom:14px; }
  .online-price{ font-family:'Fraunces',serif; font-size:20px; margin-bottom:14px; }
  .online-price span{ font-family:'Inter',sans-serif; font-size:11px; color:rgba(255,255,255,0.5); }
  .cta-secondary{ display:block; text-align:center; background:var(--white); color:var(--deep); text-decoration:none; padding:13px; border-radius:10px; font-weight:600; font-size:13.5px; }

  /* HOW IT WORKS */
  .steps-section{ margin-top:30px; }
  .step-row{ display:flex; align-items:flex-start; gap:12px; margin-bottom:14px; }
  .step-num{
    width:24px; height:24px; border-radius:50%; background:var(--foam); color:var(--mid);
    font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .step-text{ font-size:13.5px; color:#3a5a6e; padding-top:3px; line-height:1.4; }

  /* FAQ */
  .faq-section{ margin-top:30px; }
  .faq-item{ border-bottom:1px solid var(--foam); padding:14px 0; }
  .faq-q{ font-size:13.5px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  .faq-a{ font-size:12.5px; color:var(--muted); line-height:1.55; }

  footer{ text-align:center; padding:24px; font-size:11px; color:var(--muted); }
</style>

<div class="page">

  <div class="header" id="header">
    <div class="ripple ripple1"></div>
    <div class="ripple ripple2"></div>
    <div class="avatar" id="avatar"></div>
    <div class="name" id="name"></div>
    <div class="role">SWIM INSTRUCTOR · DUBAI</div>
    <p class="bio-line" id="tagline"></p>
    <div class="socials" id="socials"></div>
  </div>

  <div class="body-wrap">

    <a href="#" id="ctaWhatsapp" class="cta-primary">
      Book a Swim Lesson
      <span class="sub">WhatsApp · Instant reply</span>
    </a>

    <div class="about-section">
      <p class="section-label">About</p>
      <p class="about-text" id="aboutText"></p>
    </div>

    <div class="media-section" id="mediaSection"></div>

    <div class="locations-section">
      <p class="section-label">Where I Teach</p>
      <div id="locationsList"></div>
    </div>

    <div class="pricing">
      <p class="section-label">In-Person Packages · Dubai</p>
      <div id="packagesList"></div>
    </div>

    <p class="section-label" style="margin-top:30px;">New · Online Coaching</p>
    <div class="online-card">
      <div class="online-card-top">
        <div class="online-dot"></div>
        <span class="online-label">Now booking</span>
      </div>
      <div class="online-title">Live Online Stroke Coaching</div>
      <p class="online-desc" id="onlineDesc"></p>
      <div class="online-price" id="onlinePrice"></div>
      <a href="#" id="ctaOnline" class="cta-secondary">Book Online Session</a>
    </div>

    <div class="steps-section">
      <p class="section-label">How It Works</p>
      <div id="stepsList"></div>
    </div>

    <div class="faq-section">
      <p class="section-label">FAQ</p>
      <div id="faqList"></div>
    </div>

  </div>

  <footer id="footerText"></footer>
</div>

<script>
  document.getElementById('name').textContent = SITE.name;
  document.getElementById('tagline').textContent = SITE.tagline;
  document.getElementById('aboutText').textContent = SITE.about;
  document.getElementById('footerText').textContent = SITE.name + " · Dubai, UAE";

  // Avatar: photo if provided, else initial letter
  const avatar = document.getElementById('avatar');
  if (SITE.photo_url) {
    avatar.style.backgroundImage = `url('${SITE.photo_url}')`;
  } else {
    avatar.textContent = SITE.name.charAt(0);
  }

  // WhatsApp CTAs
  document.getElementById('ctaWhatsapp').href = SITE.whatsapp_link;
  document.getElementById('ctaOnline').href = SITE.whatsapp_link;

  // Socials
  const socialMap = [
    { key: 'tiktok_link', label: 'TikTok' },
    { key: 'instagram_link', label: 'Instagram' },
    { key: 'facebook_link', label: 'Facebook' },
  ];
  const socialsEl = document.getElementById('socials');
  socialMap.forEach(s => {
    if (SITE[s.key]) {
      const a = document.createElement('a');
      a.href = SITE[s.key];
      a.className = 'social-pill';
      a.textContent = s.label;
      a.target = '_blank';
      socialsEl.appendChild(a);
    }
  });

  // Media (photo + video)
  const mediaEl = document.getElementById('mediaSection');
  if (SITE.video_url) {
    let embed = SITE.video_url;
    if (embed.includes('watch?v=')) {
      embed = embed.replace('watch?v=', 'embed/');
    }
    const iframe = document.createElement('iframe');
    iframe.className = 'media-video';
    iframe.src = embed;
    iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
    iframe.allowFullscreen = true;
    mediaEl.appendChild(iframe);
  }

  // Locations
  const locEl = document.getElementById('locationsList');
  SITE.locations.forEach(loc => {
    const a = document.createElement('a');
    a.href = loc.map_link;
    a.target = '_blank';
    a.className = 'location-row';
    a.innerHTML = `<span class="location-text"><span class="pin-dot"></span>${loc.name}</span><span class="link-arrow">→</span>`;
    locEl.appendChild(a);
  });

  // Packages
  const pkgEl = document.getElementById('packagesList');
  SITE.packages.forEach(pkg => {
    const div = document.createElement('div');
    div.className = 'price-card' + (pkg.featured ? ' featured' : '');
    div.innerHTML = `
      ${pkg.featured ? '<div class="price-card-badge">Most Popular</div>' : ''}
      <div class="price-card-top">
        <div class="price-card-name">${pkg.name}</div>
        <div class="price-card-amount">${pkg.price}</div>
      </div>
      <p class="price-card-desc">${pkg.desc}</p>
      <div class="price-card-meta">
        ${pkg.tags.map(t => `<span class="meta-chip">${t}</span>`).join('')}
      </div>
    `;
    pkgEl.appendChild(div);
  });

  // Online coaching text
  document.getElementById('onlineDesc').textContent = SITE.online_desc;
  document.getElementById('onlinePrice').innerHTML = `${SITE.online_price} <span>/ session</span>`;

  // Steps
  const stepsEl = document.getElementById('stepsList');
  SITE.steps.forEach((step, i) => {
    const div = document.createElement('div');
    div.className = 'step-row';
    div.innerHTML = `<div class="step-num">${i + 1}</div><div class="step-text">${step}</div>`;
    stepsEl.appendChild(div);
  });

  // FAQ
  const faqEl = document.getElementById('faqList');
  SITE.faq.forEach(item => {
    const div = document.createElement('div');
    div.className = 'faq-item';
    div.innerHTML = `<div class="faq-q">${item.q}</div><div class="faq-a">${item.a}</div>`;
    faqEl.appendChild(div);
  });
</script>

</body>
</html>
